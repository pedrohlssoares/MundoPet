<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mundo Pet - Clínica Veterinária</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="navbar navbar-expand-lg sticky-top shadow-sm" style="background-color: white;">
    <div class="container">
        <a class="navbar-brand fw-bold text-uppercase d-flex align-items-center" href="#/" style="color: #2c3e50;">
            <span class="brand-icon me-2 fs-3">🐾</span> MUNDO PET
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegação">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto text-uppercase fw-semibold align-items-lg-center"
                style="font-size: 0.85rem; letter-spacing: 0.5px;" id="navLinks"></ul>
        </div>
    </div>
</header>

<main class="container py-4 flex-grow-1" id="app"></main>

<footer class="py-4 mt-auto" style="background-color: #2c3e50; color: #ecf0f1;">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">
        <div>🐾 <strong>MUNDO PET</strong> — Cuidando do seu melhor amigo com amor, tecnologia e excelência profissional.</div>
        <small>&copy; 2026 Clínica Veterinária Mundo Pet. Aplicativo cliente da MundoPet API.</small>
    </div>
</footer>

<!-- Mensagens (toasts) -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts" style="z-index: 2000;"></div>

<!-- Modal único usado por todos os formulários de cadastro/edição -->
<div class="modal fade" id="formModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content" style="border-radius: 15px;">
            <form id="modalForm" novalidate>
                <div class="modal-header">
                    <h5 class="modal-title fw-bold" id="modalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                </div>
                <div class="modal-body" id="modalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check-lg me-1"></i> Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="config.js"></script>
<script src="js/util.js"></script>
<script src="js/auth.js"></script>
<script src="js/api.js"></script>
<script src="js/resources.js"></script>
<script src="js/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
