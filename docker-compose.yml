services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./banco.sql:/docker-entrypoint-initdb.d/banco.sql   # cria o schema na 1ª execução
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      retries: 20

  api:
    build: .
    ports:
      - "5080:8080"
    environment:
      ConnectionStrings__MundoPet: "Server=db;Port=3306;Database=mundopet;User ID=root;Password=root;"
      Jwt__Key: "troque-esta-chave-por-uma-com-32-caracteres-ou-mais"
    depends_on:
      db:
        condition: service_healthy

volumes:
  dbdata:
